name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest suite
        run: npm test

      # Verifies the round-trip pipeline (BPMN XML → IR → BPMN XML) plus
      # rendering still produces clean reports across the test fixtures.
      # Catches integration regressions that the unit tests can't see.
      - name: Run verify pipeline
        run: npm run verify
